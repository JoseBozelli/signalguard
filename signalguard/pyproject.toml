[project]
name = "signalguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JoseBozelli", email = "jbozellijr@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7.0",
    "chromadb>=1.5.9",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "voyageai>=0.5.0",
]

[project.scripts]
signalguard = "signalguard:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
